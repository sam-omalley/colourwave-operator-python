<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ColourWave · {{ hostname }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    ::-webkit-scrollbar { width: 4px; background: #111; }
    ::-webkit-scrollbar-thumb { background: #2a2a2a; border-radius: 2px; }

    @keyframes pulse       { 0%,100%{opacity:1}      50%{opacity:0.35} }
    @keyframes fade-in     { from{opacity:0;transform:scale(.94)} to{opacity:1;transform:scale(1)} }
    @keyframes chip-appear { from{opacity:0;transform:translateY(-4px)} to{opacity:1;transform:translateY(0)} }
    @keyframes chip-leave  { from{opacity:1;transform:scale(1)} to{opacity:0;transform:scale(.85)} }

    body {
      font-family: 'IBM Plex Mono', monospace;
      background: #060606;
      color: #e2e8f0;
      min-height: 100vh;
      padding: 32px 24px;
    }

    .container { max-width: 900px; margin: 0 auto; }

    /* ── Header ─────────────────────────────────────────── */
    .header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 4px; }
    .header-left { display: flex; align-items: center; gap: 14px; }
    .header-label { font-size: 11px; color: #888; letter-spacing: 0.15em; }
    .header-divider { color: #444; }
    .header-title { font-size: 18px; font-weight: 700; letter-spacing: -0.02em; color: #e2e8f0; }
    .header-self { font-size: 10px; color: #555; text-align: right; line-height: 1.8; }
    .header-self span { color: #888; }
    .header-rule { height: 1px; background: linear-gradient(90deg,#1f1f1f 0%,#111 100%); margin-bottom: 24px; }

    /* ── ColourWave card ────────────────────────────────── */
    .cw-card {
      background: #0a0a0a;
      border: 1px solid #1f1f1f;
      border-left: 3px solid #444;   /* overridden per-instance via JS */
      border-radius: 6px;
      padding: 18px 20px 14px;
      margin-bottom: 14px;
    }
    /* Animations only fire when the class is explicitly added by JS */
    .cw-card.is-new { animation: fade-in 0.2s ease; }

    .cw-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 14px; }
    .cw-name-row { display: flex; align-items: center; gap: 10px; }
    .cw-name {
      font-size: 14px; font-weight: 700; color: #f0f0f0;
      text-decoration: none;
    }
    .cw-name:hover { color: #60a5fa; text-decoration: underline; }

    .cw-meta { font-size: 10px; color: #555; margin-top: 4px; display: flex; gap: 8px; align-items: center; }
    .cw-meta-sep { color: #333; }
    .cw-version { color: #a78bfa; }
    .cw-ns { color: #7c9eb5; }
    .cw-count { color: #777; }

    .cw-tally { font-size: 10px; color: #555; text-align: right; white-space: nowrap; }
    .cw-tally-num { font-size: 13px; font-weight: 600; color: #888; }

    /* ── State badge (reuse from UI) ────────────────────── */
    .badge {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 10px; font-weight: 600; padding: 2px 8px;
      border-radius: 3px; letter-spacing: 0.06em; text-transform: uppercase;
    }
    .badge-dot { width: 5px; height: 5px; border-radius: 50%; }
    .badge-running { background:#0d2b1a; border:1px solid #1a5c35; color:#4ade80; }
    .badge-running .badge-dot { background:#22c55e; box-shadow:0 0 5px #22c55e; animation:pulse 2s infinite; }
    .badge-stopped { background:#1c1c1c; border:1px solid #3a3a3a; color:#9ca3af; }
    .badge-stopped .badge-dot { background:#6b7280; }

    /* ── Pod chips ──────────────────────────────────────── */
    .pods {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      min-height: 28px;
      align-items: center;
    }

    .no-pods { font-size: 10px; color: #333; letter-spacing: 0.08em; }

    .pod-chip {
      display: inline-flex; align-items: center; gap: 6px;
      border: 1px solid #333; border-radius: 3px;
      padding: 4px 9px;
      font-size: 10px; font-family: 'IBM Plex Mono', monospace;
      cursor: default; user-select: none;
      transition: border-color 0.4s ease, color 0.4s ease, opacity 0.3s ease;
    }
    .pod-chip:hover { filter: brightness(1.3); }
    .pod-chip.is-new  { animation: chip-appear 0.25s ease; }
    .pod-chip.is-gone { animation: chip-leave 0.25s ease forwards; }

    .pod-dot { width: 5px; height: 5px; border-radius: 50%; background: #444; flex-shrink: 0; }

    /* status variants */
    .pod-running  { border-color: #1a5c35; color: #4ade80; }
    .pod-running .pod-dot  { background: #22c55e; box-shadow: 0 0 5px #22c55e; animation: pulse 2.5s infinite; }

    .pod-starting,
    .pod-pending  { border-color: #3d4f1a; color: #a3e635; }
    .pod-starting .pod-dot,
    .pod-pending  .pod-dot { background: #84cc16; box-shadow: 0 0 5px #84cc16; animation: pulse 1.2s infinite; }

    .pod-terminating { border-color: #4a3000; color: #fbbf24; opacity: 0.6; }
    .pod-terminating .pod-dot { background: #f59e0b; }

    .pod-error   { border-color: #7f1d1d; color: #f87171; }
    .pod-error .pod-dot { background: #ef4444; box-shadow: 0 0 5px #ef4444; }

    .pod-stopped,
    .pod-unknown { border-color: #2a2a2a; color: #6b7280; }
    .pod-stopped .pod-dot,
    .pod-unknown .pod-dot { background: #4b5563; }

    /* this pod */
    .pod-self { outline: 1px solid #60a5fa44; outline-offset: 2px; }
    .pod-self-label { font-size: 9px; color: #60a5fa; margin-left: 2px; }

    /* restart counter */
    .pod-restarts { font-size: 9px; color: #666; margin-left: 1px; }

    /* ── Error / empty states ───────────────────────────── */
    .state-error { font-size: 11px; color: #f87171; padding: 20px 0; }
    .state-empty { font-size: 11px; color: #444; padding: 20px 0; }

    /* ── Footer ─────────────────────────────────────────── */
    .footer { margin-top: 20px; font-size: 10px; color: #333; display: flex; justify-content: space-between; }
    .footer-updated { color: #444; }
  </style>
</head>
<body>
<main class="container">
  <div class="header">
    <div class="header-left">
      <span class="header-label">MONITOR</span>
      <span class="header-divider">|</span>
      <span class="header-title">ColourWave</span>
    </div>
    <div class="header-self">
      <span>{{ hostname }}</span><br>
      <span style="color:#a78bfa">{{ version }}</span>
      · <span style="display:inline-block;width:8px;height:8px;border-radius:2px;
                    background:{{ colour }};border:1px solid rgba(255,255,255,0.15);
                    vertical-align:middle"></span>
    </div>
  </div>
  <div class="header-rule"></div>

  <div id="cards"></div>

  <div class="footer">
    <span>colourwave-py · lizardnode.com</span>
    <span class="footer-updated" id="updated"></span>
  </div>
</main>

<script>
  // The pod name of the replica serving this request — highlighted with ◄
  const SELF = "{{ hostname }}";

  const POD_STATUS_CLASSES = [
    'pod-running','pod-starting','pod-pending',
    'pod-terminating','pod-error','pod-stopped','pod-unknown'
  ];

  // ── Fetch ───────────────────────────────────────────────────────────────

  async function load() {
    try {
      const res = await fetch('/api/instances');
      if (!res.ok) throw new Error(await res.text());
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      reconcile(data);
      document.getElementById('updated').textContent =
        'updated ' + new Date().toLocaleTimeString('en-US', { hour12: false });
    } catch(e) {
      document.getElementById('cards').innerHTML =
        `<div class="state-error">error loading instances — ${e.message}</div>`;
    }
  }

  // ── Reconcile cards ─────────────────────────────────────────────────────
  // Diff the live data against the DOM. Only create/destroy/mutate nodes
  // that actually changed so animations don't fire on every poll tick.

  function reconcile(instances) {
    const container = document.getElementById('cards');

    if (!instances.length) {
      container.innerHTML = '<div class="state-empty">no ColourWave instances found</div>';
      return;
    }

    const seen = new Set();

    for (const cw of instances) {
      seen.add(cw.name);
      let cardEl = document.getElementById(`card-${cw.name}`);

      if (!cardEl) {
        cardEl = buildCard(cw);
        cardEl.classList.add('is-new');
        cardEl.addEventListener('animationend', () => cardEl.classList.remove('is-new'), { once: true });
        container.appendChild(cardEl);
      } else {
        updateCard(cardEl, cw);
      }
    }

    // Remove cards for instances that no longer exist
    for (const el of container.querySelectorAll('.cw-card')) {
      if (!seen.has(el.dataset.name)) el.remove();
    }
  }

  // ── Build a card from scratch ────────────────────────────────────────────

  function buildCard(cw) {
    const el = document.createElement('div');
    el.className = 'cw-card';
    el.id = `card-${cw.name}`;
    el.dataset.name = cw.name;
    el.style.borderLeftColor = cw.colour;

    el.innerHTML = `
      <div class="cw-header">
        <div>
          <div class="cw-name-row">
            <a class="cw-name"
               href="https://${cw.name}.lizardnode.com"
               target="_blank" rel="noopener">${cw.name}</a>
            <span class="cw-badge"></span>
          </div>
          <div class="cw-meta">
            <span class="cw-version"></span>
            <span class="cw-meta-sep">·</span>
            <span class="cw-ns">${cw.namespace}</span>
            <span class="cw-meta-sep">·</span>
            <span class="cw-colour-swatch"
                  style="display:inline-block;width:8px;height:8px;border-radius:2px;
                         background:${cw.colour};border:1px solid rgba(255,255,255,0.12);
                         vertical-align:middle"></span>
          </div>
        </div>
        <div class="cw-tally">
          <span class="cw-tally-running"></span><span style="color:#333">/</span><span class="cw-tally-desired"></span>
          <br><span class="cw-tally-label"></span>
        </div>
      </div>
      <div class="pods"></div>`;

    updateCard(el, cw);
    return el;
  }

  // ── Update a card's mutable parts in-place ───────────────────────────────

  function updateCard(cardEl, cw) {
    const running     = cw.pods.filter(p => p.status === 'running').length;
    const desired     = cw.state === 'stopped' ? 0 : cw.replicas;
    const terminating = cw.pods.filter(p => p.status === 'terminating').length;

    // State badge
    const badgeEl = cardEl.querySelector('.cw-badge');
    if (badgeEl.dataset.state !== cw.state) {
      badgeEl.dataset.state = cw.state;
      badgeEl.className = `cw-badge badge ${cw.state === 'running' ? 'badge-running' : 'badge-stopped'}`;
      badgeEl.innerHTML = `<span class="badge-dot"></span>${cw.state === 'running' ? 'Running' : 'Stopped'}`;
    }

    // Version (may change on rolling update)
    const versionEl = cardEl.querySelector('.cw-version');
    if (versionEl.textContent !== cw.version) versionEl.textContent = cw.version;

    // Tally
    const runningEl = cardEl.querySelector('.cw-tally-running');
    const desiredEl = cardEl.querySelector('.cw-tally-desired');
    const labelEl   = cardEl.querySelector('.cw-tally-label');
    runningEl.textContent    = running;
    runningEl.style.color    = running < desired ? '#fbbf24' : '';
    desiredEl.textContent    = desired;
    labelEl.textContent      = terminating > 0 ? `${terminating} terminating` : 'replicas';

    // Pod chips
    reconcilePods(cardEl.querySelector('.pods'), cw.pods);
  }

  // ── Reconcile pod chips inside a card ────────────────────────────────────

  function reconcilePods(podsEl, pods) {
    const seen = new Set();

    for (const pod of pods) {
      seen.add(pod.name);
      let chipEl = podsEl.querySelector(`[data-pod="${pod.name}"]`);

      if (!chipEl) {
        chipEl = buildChip(pod);
        chipEl.classList.add('is-new');
        chipEl.addEventListener('animationend', () => chipEl.classList.remove('is-new'), { once: true });
        podsEl.appendChild(chipEl);
      } else {
        updateChip(chipEl, pod);
      }
    }

    // Remove chips for pods that are gone — animate out first
    for (const el of podsEl.querySelectorAll('[data-pod]')) {
      if (!seen.has(el.dataset.pod) && !el.classList.contains('is-gone')) {
        el.classList.add('is-gone');
        el.addEventListener('animationend', () => el.remove(), { once: true });
      }
    }

    // Empty-state label
    let emptyEl = podsEl.querySelector('.no-pods');
    const hasChips = podsEl.querySelectorAll('[data-pod]').length > 0;
    if (!hasChips && !emptyEl) {
      emptyEl = document.createElement('span');
      emptyEl.className = 'no-pods';
      emptyEl.textContent = '— no replicas —';
      podsEl.appendChild(emptyEl);
    } else if (hasChips && emptyEl) {
      emptyEl.remove();
    }
  }

  function buildChip(pod) {
    const isSelf = pod.name === SELF;
    const short  = pod.name.split('-').slice(-1)[0];
    const el     = document.createElement('span');
    el.dataset.pod    = pod.name;
    el.dataset.status = pod.status;
    el.title          = pod.name;
    el.className      = `pod-chip pod-${pod.status}${isSelf ? ' pod-self' : ''}`;
    el.innerHTML = `<span class="pod-dot"></span>`
      + `<span class="pod-short">${short}</span>`
      + `<span class="pod-restarts"></span>`
      + (isSelf ? `<span class="pod-self-label">◄</span>` : '');
    updateChip(el, pod);
    return el;
  }

  function updateChip(chipEl, pod) {
    // Status classes — CSS transitions handle the colour change smoothly
    if (chipEl.dataset.status !== pod.status) {
      chipEl.dataset.status = pod.status;
      POD_STATUS_CLASSES.forEach(c => chipEl.classList.remove(c));
      chipEl.classList.add(`pod-${pod.status}`);
    }
    // Restart counter
    const restartEl = chipEl.querySelector('.pod-restarts');
    const txt = pod.restarts > 0 ? ` ${pod.restarts}↺` : '';
    if (restartEl.textContent !== txt) restartEl.textContent = txt;
    // Tooltip
    const tip = pod.name + (pod.restarts > 0 ? ` · ${pod.restarts} restart(s)` : '');
    if (chipEl.title !== tip) chipEl.title = tip;
  }

  // ── Init ────────────────────────────────────────────────────────────────

  load();
  setInterval(load, 2000);
</script>
</body>
</html>
